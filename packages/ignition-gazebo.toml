name = "ignition-gazebo"
category = "Simulation"
version = "harmonic"
summary = "Gazebo Sim (gz-sim), formerly Ignition Gazebo"
requires = []

# ROS distros ship the ROS integration metapackage, which pulls in the matching gz-sim.
[install.jazzy]
pkg = "ros-jazzy-ros-gz"

[install.kilted]
pkg = "ros-kilted-ros-gz"

[install.lyrical]
pkg = "ros-lyrical-ros-gz"

# Any other ROS or Ubuntu image gets Gazebo Harmonic straight from the OSRF repository.
# The recipe is re-runnable: the keyring and source list are rewritten, not appended.
[install.ros]
script = '''apt-get update \
    && apt-get install -y --no-install-recommends curl gnupg lsb-release \
    && curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg \
    && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" > /etc/apt/sources.list.d/gazebo-stable.list \
    && apt-get update \
    && apt-get install -y --no-install-recommends gz-harmonic \
    && gz sim --versions \
    && rm -rf /var/lib/apt/lists/*'''

[install.ubuntu]
script = '''apt-get update \
    && apt-get install -y --no-install-recommends curl gnupg lsb-release \
    && curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg \
    && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" > /etc/apt/sources.list.d/gazebo-stable.list \
    && apt-get update \
    && apt-get install -y --no-install-recommends gz-harmonic \
    && gz sim --versions \
    && rm -rf /var/lib/apt/lists/*'''
