name = "isaac-sim"
category = "Simulation"
version = "6.2.0.0"
summary = "NVIDIA Isaac Sim (pip, several GB, needs a GPU)"
requires = ["uv"]

# Isaac Sim refuses to run until the Omniverse EULA is accepted; setting the variable
# accepts it for every shell in the image (and for anything that boots Kit at build time).
[env]
OMNI_KIT_ACCEPT_EULA = "YES"

# This follows NVIDIA's own pip procedure (the `install_python.py` shipped inside the
# `isaacsim` wheel) and the IsaacLab "installing Isaac Sim" guide, rather than trying to make
# one big resolver call satisfy everything:
#
#   1. a Python 3.12 venv — 6.x refuses any other interpreter version;
#   2. `isaacsim[all]` from PyPI, resolving NVIDIA's own wheels through their index;
#   3. CUDA PyTorch from PyTorch's index, *replacing* the one step 2 installed. This is the
#      part that used to go wrong: PyPI's `torch` is built against a fixed CUDA version
#      (13.0 for 2.11), which only runs on very recent drivers, while the cu128 build works
#      from driver 525 up. The pins match `isaacsim-core`'s own requirements — bump them
#      together with the package version;
#   4. `uv pip check`, so an inconsistent environment fails the build instead of the user's
#      first launch, and a torch build without CUDA support is caught (that check needs no
#      GPU);
#   5. `isaacsim --help`, which loads Kit's argument parser and therefore proves the console
#      script, the interpreter and the Kit binaries work. It needs no GPU and no Vulkan, and
#      it does not ask for the EULA — importing `isaacsim` instead would boot the simulator.
#      Kit refuses to start as root ("cannot be run as the root user without …") and dies
#      with SIGSEGV instead of saying so twice, which is exactly the uid a container build
#      has, so the check sets OMNI_KIT_ALLOW_ROOT=1. That variable is not baked into the
#      image: the toolbox runs as uid 1000, and Kit's advice about running as root stands.
# A build of this size saturates the default HTTP settings: uv gives up after a 30 s stall and
# after 3 retries, with up to 16 wheels in flight. Raise both budgets and download fewer files
# at a time — a slow link then takes longer, but stops failing.
#
# Three flags are required for the dependency set to resolve:
#   --extra-index-url https://pypi.nvidia.com  isaacsim-core pins its OpenCV fork
#       (opencv-python-headless-noffmpeg==4.14.0.94rc3), which NVIDIA only publishes there;
#       PyPI has an empty placeholder of that name.
#   --index-strategy unsafe-best-match         search both indexes instead of stopping at the
#       first one that knows the name.
#   --prerelease=allow                         some pinned dependencies are pre-releases
#       (tinyobjloader==2.0.0rc13).
#
# `[all]` is the documented bundle (~165 wheels, several GB). Plain `isaacsim` is not enough:
# without the app/gui extensions `import isaacsim` warns that `isaacsim.simulation_app` is
# unavailable. The Kitt extension caches (another 7.4 GB, what NVIDIA calls `[extscache]`) are
# *not* included — install the `isaac-sim-cache` package as well for an image that does not
# download them on first launch.
# Only Ubuntu-based images are supported upstream — ROS, plain Ubuntu and images classified
# as "other" (custom Ubuntu derivatives). There is no `default` entry, so Fedora images
# simply do not offer it.
[install.ros]
script = '''{ [ "$(uname -m)" = x86_64 ] || [ "$(uname -m)" = aarch64 ]; } || { echo "Isaac Sim ships x86_64 and aarch64 wheels only; this machine is $(uname -m)" >&2; exit 1; } \
    && rm -rf /opt/toolbox/isaacsim \
    && uv venv --python 3.12 /opt/toolbox/isaacsim/venv \
    && UV_HTTP_TIMEOUT=120 UV_HTTP_RETRIES=10 UV_CONCURRENT_DOWNLOADS=4 \
        uv pip install --python /opt/toolbox/isaacsim/venv/bin/python \
        --no-cache \
        --extra-index-url https://pypi.nvidia.com \
        --index-strategy unsafe-best-match \
        --prerelease=allow \
        "isaacsim[all]==6.2.0.0" \
    && UV_HTTP_TIMEOUT=120 UV_HTTP_RETRIES=10 \
        uv pip install --python /opt/toolbox/isaacsim/venv/bin/python \
        --index-url https://download.pytorch.org/whl/cu128 \
        --reinstall-package torch \
        --reinstall-package torchvision \
        --reinstall-package torchaudio \
        "torch==2.11.0" "torchvision==0.26.0" "torchaudio==2.11.0" \
    && uv pip check --python /opt/toolbox/isaacsim/venv/bin/python \
    && /opt/toolbox/isaacsim/venv/bin/python -c "import importlib.metadata as m; print('isaacsim', m.version('isaacsim'))" \
    && /opt/toolbox/isaacsim/venv/bin/python -c "import torch; assert torch.version.cuda, 'torch is a CPU-only build'; print('torch', torch.__version__, 'CUDA', torch.version.cuda)" \
    && OMNI_KIT_ACCEPT_EULA=YES OMNI_KIT_ALLOW_ROOT=1 /opt/toolbox/isaacsim/venv/bin/isaacsim --help > /dev/null \
    && ln -sf /opt/toolbox/isaacsim/venv/bin/isaacsim /usr/local/bin/isaacsim \
    && chmod -R a+rwX /opt/toolbox/isaacsim'''

