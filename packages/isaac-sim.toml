    && ln -sf /opt/toolbox/isaacsim/venv/bin/isaacsim /usr/local/bin/isaacsim \
    && chmod -R a+rwX /opt/toolbox/isaacsim \
    && /opt/toolbox/isaacsim/venv/bin/python -c "import importlib.metadata as m; print('isaacsim', m.version('isaacsim'))"'''

[install.other]
script = '''{ [ "$(uname -m)" = x86_64 ] || [ "$(uname -m)" = aarch64 ]; } || { echo "Isaac Sim ships x86_64 and aarch64 wheels only; this machine is $(uname -m)" >&2; exit 1; } \
    && rm -rf /opt/toolbox/isaacsim \
    && uv venv --python 3.12 /opt/toolbox/isaacsim/venv \
    && UV_HTTP_TIMEOUT=120 UV_HTTP_RETRIES=10 UV_CONCURRENT_DOWNLOADS=4 \
        uv pip install --python /opt/toolbox/isaacsim/venv/bin/python \
        --extra-index-url https://pypi.nvidia.com \
        --index-strategy unsafe-best-match \
        --prerelease=allow \
        "isaacsim[all]==6.2.0.0" \
    && ln -sf /opt/toolbox/isaacsim/venv/bin/isaacsim /usr/local/bin/isaacsim \
    && chmod -R a+rwX /opt/toolbox/isaacsim \
    && /opt/toolbox/isaacsim/venv/bin/python -c "import importlib.metadata as m; print('isaacsim', m.version('isaacsim'))"'''
