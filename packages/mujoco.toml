name = "mujoco"
category = "Simulation"
version = "3.17.0"
summary = "MuJoCo physics engine: C library, Python bindings and the `simulate` viewer"
requires = ["uv"]

# Works everywhere Python does, so this is a `default` entry: the release tarball provides
# the C library/headers and the `simulate` GUI (checksum-verified, unpacked under
# /opt/toolbox/mujoco), the Python bindings come from PyPI into the system interpreter.
# `{{arch:…}}` picks the x86_64 or aarch64 tarball for the build machine, and the published
# `.sha256` asset is fetched alongside it, so the checksum matches on both architectures.
# The Python bindings go into the system interpreter, which needs `--break-system-packages`
# on the Debian/Ubuntu images (PEP 668 marks it as externally managed).
[install.default]
script = '''MUJOCO_VERSION=3.17.0 \
    && rm -rf /opt/toolbox/mujoco \
    && mkdir -p /opt/toolbox/mujoco \
    && MUJOCO_ASSET="mujoco-${MUJOCO_VERSION}-linux-{{arch:x86_64,aarch64}}.tar.gz" \
    && curl -fsSL -o /tmp/mujoco.tar.gz "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/${MUJOCO_ASSET}" \
    && curl -fsSL -o /tmp/mujoco.sha256 "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/${MUJOCO_ASSET}.sha256" \
    && sed "s|${MUJOCO_ASSET}|mujoco.tar.gz|" /tmp/mujoco.sha256 | (cd /tmp && sha256sum -c -) \
    && tar zx --strip-components=1 -C /opt/toolbox/mujoco -f /tmp/mujoco.tar.gz \
    && rm -f /tmp/mujoco.tar.gz /tmp/mujoco.sha256 \
    && ls /opt/toolbox/mujoco/lib/libmujoco.so* >/dev/null \
    && ln -sf /opt/toolbox/mujoco/bin/simulate /usr/local/bin/mujoco-simulate \
    && uv pip install --system --break-system-packages --no-cache "mujoco==${MUJOCO_VERSION}" \
    && python3 -c "import mujoco; print('mujoco', mujoco.__version__)"'''
